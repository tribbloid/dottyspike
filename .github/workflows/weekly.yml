name: Weekly Maintenance

on:
  schedule:
    - cron: '0 2 * * 1'  # Run every Monday at 2 AM UTC
  workflow_dispatch:

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Update Gradle Wrapper
      run: ./gradlew wrapper --gradle-version=8.5

    - name: Check for dependency updates
      run: ./gradlew dependencyUpdates || true

    - name: Build with updated dependencies
      run: ./gradlew clean build

    - name: Create Pull Request for dependency updates
      if: failure()
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore: update dependencies'
        title: 'Weekly dependency updates'
        body: |
          Automated dependency updates from weekly maintenance workflow.

          Please review and test the changes before merging.
        branch: chore/dependency-updates
        delete-branch: true

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run comprehensive security scan
      run: ./gradlew dependencyCheckAnalyze || true

    - name: Generate security report
      if: always()
      run: |
        echo "## Security Scan Results" > security-report.md
        echo "Generated on: $(date)" >> security-report.md
        if [ -f "build/reports/dependency-check-report.html" ]; then
          echo "Security report generated successfully." >> security-report.md
        else
          echo "No security vulnerabilities found or report generation failed." >> security-report.md
        fi

    - name: Upload security report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-report
        path: |
          build/reports/dependency-check-report.html
          security-report.md
        retention-days: 30